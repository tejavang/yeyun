<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }
        header {
            margin-top: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        header h1 {
            font-size: 26px;
            color: #1a1a1a;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* 로그인 / 아이디 박스 스타일 */
        .user-section {
            background-color: #ffffff;
            padding: 10px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .user-status {
            color: #555;
            font-weight: 600;
        }

        .user-status b {
            color: #f39c12;
        }

        .user-input-container {
            display: flex;
            gap: 6px;
        }

        .user-input-container input {
            width: 85px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 12px;
            outline: none;
            text-align: center;
        }

        .user-input-container button {
            padding: 4px 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .user-input-container button:active {
            opacity: 0.8;
        }

        /* 3x4 그리드 레이아웃 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 한 줄에 3개 */
            grid-template-rows: repeat(4, auto);   /* 총 4줄 */
            gap: 15px;
            width: 100%;
            max-width: 400px; /* 모바일 맞춤 너비 */
        }

        /* 카드 아이콘 스타일 */
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            aspect-ratio: 1 / 1; /* 정사각 비율 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #2c3e50;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            padding: 10px;
            text-align: center;
        }

        .card:active {
            transform: scale(0.95);
            background-color: #f8f9fa;
        }

        @media (hover: hover) {
            .card:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            }
        }

        .card .icon {
            font-size: 32px;
            margin-bottom: 8px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card .title {
            font-size: 13px;
            font-weight: 600;
            word-break: keep-all;
            line-height: 1.2;
        }

        /* 비어있는 슬롯 스타일 */
        .card.empty {
            background-color: rgba(255, 255, 255, 0.4);
            border: 2px dashed #cbd5e1;
            box-shadow: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal</h1>
    </header>

    <!-- 접속 사용자 아이디 입력 및 표시 영역 -->
    <!-- 기존 .user-section을 이렇게 교체하세요 -->
    <div class="user-section" style="flex-direction: column; align-items: stretch; gap: 10px;">
        <!-- 상단: 아이디 입력 및 상태 -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="user-status">ID: <b id="portal-user-id">미설정</b></div>
            <div class="user-input-container" id="user-input-area">
                <input type="text" id="portal-id-input" placeholder="yeyun 등">
                <button onclick="savePortalUserId()">등록</button>
            </div>
        </div>
        
        <!-- 하단: 재화 상태 및 교환 버튼 (로그인 시에만 표시되도록 제어) -->
        <div id="user-wallet-area" style="display: none; justify-content: space-between; align-items: center; border-top: 1px solid #f0f0f0; padding-top: 10px; margin-top: 5px;">
            <div style="font-size: 13px; font-weight: 600;">
                ⭐ <span id="portal-stars">0</span> | 🪙 <span id="portal-coins">0</span>
            </div>
            <button onclick="exchangeStarToCoin()" style="padding: 4px 10px; background-color: #f39c12; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;">
                별 ➔ 코인 교환
            </button>
        </div>
    </div>

    <main class="grid-container">
        <!-- 1. D사전 -->
        <a href="https://small.dic.daum.net/index.do?dic=eng" class="card">
            <div class="icon">📖</div>
            <div class="title">D사전</div>
        </a>

        <!-- 2. QR링크 -->
        <a href="https://yeyun.vercel.app/qrlink" class="card">
            <div class="icon">📷</div>
            <div class="title">QR링크</div>
        </a>

        <!-- 3. 🥑VOCA -->
        <a href="https://yeyun.vercel.app/avoca" class="card">
            <div class="icon">🥑</div>
            <div class="title">VOCA</div>
        </a>

        <!-- 4. Tetris (테트리스 블록 SVG 아이콘 적용) -->
        <a href="tetris.html" class="card">
            <div class="icon">
                <svg width="36" height="36" viewBox="0 0 40 40">
                    <!-- 레고 느낌의 테트리스 미노 블록 구성 -->
                    <rect x="14" y="4" width="12" height="12" rx="2" fill="#9b59b6" stroke="#111" stroke-width="1.5" />
                    <rect x="2" y="16" width="12" height="12" rx="2" fill="#9b59b6" stroke="#111" stroke-width="1.5" />
                    <rect x="14" y="16" width="12" height="12" rx="2" fill="#9b59b6" stroke="#111" stroke-width="1.5" />
                    <rect x="26" y="16" width="12" height="12" rx="2" fill="#9b59b6" stroke="#111" stroke-width="1.5" />
                    <rect x="2" y="28" width="12" height="12" rx="2" fill="#00a8ff" stroke="#111" stroke-width="1.5" />
                    <rect x="14" y="28" width="12" height="12" rx="2" fill="#f1c40f" stroke="#111" stroke-width="1.5" />
                    <rect x="26" y="28" width="12" height="12" rx="2" fill="#f1c40f" stroke="#111" stroke-width="1.5" />
                </svg>
            </div>
            <div class="title">Tetris</div>
        </a>

        <!-- 5~12번 빈 슬롯 -->
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
    </main>

    <script>
        const ALLOWED_USERS = ['yeyun', 'woosong', 'jinyoung'];

        // 기존 script 영역의 loadUserId 함수를 수정하고 새로운 함수를 추가합니다.
        
        function loadUserId() {
            const savedId = localStorage.getItem('tetris_user_id');
            const displayTag = document.getElementById('portal-user-id');
            const inputArea = document.getElementById('user-input-area');
            const walletArea = document.getElementById('user-wallet-area');
        
            if (savedId && ALLOWED_USERS.includes(savedId)) {
                displayTag.innerText = savedId;
                inputArea.style.display = 'none';
                walletArea.style.display = 'flex'; // 로그인 성공 시 지갑 영역 표시
                fetchUserData(savedId); // 서버에서 별/코인 개수 가져오기
            } else {
                displayTag.innerText = '미설정';
                inputArea.style.display = 'flex';
                walletArea.style.display = 'none';
            }
        }
        
        // 유저 데이터(별, 코인) 불러오기
        function fetchUserData(userId) {
            // 백엔드 주소가 필요합니다. (예: http://localhost:3000)
            fetch(`/api/user-data?userId=${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('portal-stars').innerText = data.stars || 0;
                    document.getElementById('portal-coins').innerText = data.coins || 0;
                })
                .catch(err => console.error('데이터 불러오기 실패:', err));
        }
        
        // 별을 코인으로 교환 (예: 1별 = 10코인)
        function exchangeStarToCoin() {
            const userId = localStorage.getItem('tetris_user_id');
            const currentStars = parseInt(document.getElementById('portal-stars').innerText);
        
            if (currentStars <= 0) {
                alert("교환할 별이 부족합니다!");
                return;
            }
        
            if (confirm(`현재 ${currentStars}개의 별이 있습니다. 코인으로 교환하시겠습니까? (1⭐ = 10🪙)`)) {
                fetch('/api/exchange-stars', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert("성공적으로 교환되었습니다!");
                        // UI 즉시 업데이트 (서버 응답 데이터 기반)
                        document.getElementById('portal-stars').innerText = data.stars;
                        document.getElementById('portal-coins').innerText = data.coins;
                    } else {
                        alert(data.message || "교환에 실패했습니다.");
                    }
                })
                .catch(err => alert("서버 오류가 발생했습니다."));
            }
        }

        function savePortalUserId() {
            const inputVal = document.getElementById('portal-id-input').value.trim().toLowerCase();
            if (!ALLOWED_USERS.includes(inputVal)) {
                alert('허용되지 않은 아이디입니다.\n');
                return;
            }
            localStorage.setItem('tetris_user_id', inputVal);
            loadUserId();
        }

        // 페이지 로드 시 사용자 아이디 불러오기
        loadUserId();
    </script>
</body>
</html>
