<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }
        header {
            margin-top: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        header h1 {
            font-size: 26px;
            color: #1a1a1a;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        
        /* 3x4 그리드 레이아웃 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 한 줄에 3개 */
            grid-template-rows: repeat(4, auto);   /* 총 4줄 */
            gap: 15px;
            width: 100%;
            max-width: 400px; /* 모바일 맞춤 너비 */
        }

        /* 카드 아이콘 스타일 */
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            aspect-ratio: 1 / 1; /* 정사각 비율 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #2c3e50;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            padding: 10px;
            text-align: center;
        }

        .card:active {
            transform: scale(0.95);
            background-color: #f8f9fa;
        }

        @media (hover: hover) {
            .card:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            }
        }

        .card .icon {
            font-size: 32px;
            margin-bottom: 8px;
            line-height: 1;
        }

        .card .title {
            font-size: 13px;
            font-weight: 600;
            word-break: keep-all;
            line-height: 1.2;
        }

        /* 비어있는 슬롯 스타일 */
        .card.empty {
            background-color: rgba(255, 255, 255, 0.4);
            border: 2px dashed #cbd5e1;
            box-shadow: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal</h1>
    </header>

    <main class="grid-container">
        <!-- 1. D사전 -->
        <a href="https://small.dic.daum.net/index.do?dic=eng" class="card">
            <div class="icon">📖</div>
            <div class="title">D사전</div>
        </a>

        <!-- 2. QR링크 -->
        <a href="https://yeyun.vercel.app/qrlink" class="card">
            <div class="icon">📷</div>
            <div class="title">QR링크</div>
        </a>

        <!-- 3. 🥑VOCA -->
        <a href="https://yeyun.vercel.app/avoca" class="card">
            <div class="icon">🥑</div>
            <div class="title">VOCA</div>
        </a>

        <!-- 4~12번 빈 슬롯 -->
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
        <div class="card empty"></div>
    </main>

</body>
</html>
